name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  # Run tests
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tests
        run: |
          docker compose build
          ./bin/setup-dev.sh

      - name: Run standardrb
        run: docker compose run --rm test bundle exec standardrb

      - name: Run i18n-tasks health
        run: docker compose run --rm test bundle exec i18n-tasks health

      - name: Run tests
        run: docker compose run --rm test

      - name: Report to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: unit
          parallel: true

      - name: Run rspec
        run: docker compose run --rm test bundle exec rspec

      - name: Report to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: rspec
          parallel: true

      - name: Run system tests
        run: docker compose run system-test

      - name: Report to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: integration
          parallel: true

      - name: Coveralls Finished
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: integration
          parallel-finished: true
